<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Dr. Hang Li — home">
      <span class="site-brand__mark" aria-hidden="true">HL<span class="brand-dot">.</span></span>
      <span class="site-brand__name">Dr. Hang Li</span>
    </a>
    <nav class="site-navigation" id="site-navigation" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        {% assign active = false %}
        {% if link.url != '/#research' and page.url contains link.url %}{% assign active = true %}{% endif %}
        <a class="nav-link{% if active %} is-active{% endif %}" href="{% if link.url contains '://' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if active %} aria-current="page"{% endif %}>{{ link.title }}{% if link.title == 'CV' %}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>{% endif %}</a>
      {% endfor %}
    </nav>
    <div class="nav-actions">
      <button class="icon-button theme-toggle" type="button" aria-label="Appearance: system. Switch to light appearance." title="Appearance: system" hidden>
        <svg data-theme-icon="system" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>
        <svg data-theme-icon="light" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        <svg data-theme-icon="dark" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" hidden><path d="M20.7 13.4A9 9 0 0 1 10.6 3.3a9 9 0 1 0 10.1 10.1Z"/></svg>
      </button>
      <button class="icon-button menu-toggle" type="button" aria-label="Open navigation" aria-controls="site-navigation" aria-expanded="false" hidden>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg>
      </button>
    </div>
  </div>
</header>
