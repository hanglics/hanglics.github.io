<link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/favicon.png' | relative_url }}">
<link rel="mask-icon" href="{{ '/images/safari-pinned-tab.svg' | relative_url }}" color="#2469df">
{% if page.math %}
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: { equationNumbers: { autoNumber: 'all' } },
    tex2jax: { inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML" async></script>
{% endif %}
