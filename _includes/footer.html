<div class="site-container footer-inner">
  <div class="footer-brand">
    <a href="{{ '/' | relative_url }}">Dr. Hang Li<span class="brand-dot">.</span></a>
    <p>Information Retrieval. Large Language Models. Better Search.</p>
  </div>
  <nav class="footer-links" aria-label="Social and contact links">
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}">Scholar <span aria-hidden="true">↗</span></a>{% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub <span aria-hidden="true">↗</span></a>{% endif %}
  </nav>
  <div class="footer-meta">
    <span>&copy; {{ site.time | date: '%Y' }} Dr. Hang Li</span>
    <span>Brisbane, Australia</span>

</div>
