  body: "🎉 Our team ielab (<a href=\"https://arvinzhuang.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">Shengyao Zhuang</a>, <a href=\"http://ielab.io/people/shuai-wang\" target=\"_blank\" rel=\"noopener noreferrer\">Shuai Wang</a>, and myself) successfully defended our method and won the championship in the <a href=\"https://developer.huawei.com/consumer/en/activity/devStarAI/algo/competition.html#/preliminary/info/007/introduction\" target=\"_blank\" rel=\"noopener noreferrer\">\"Search Rankings in Multimodal and Multilingual Contexts Track\"</a> within the <a href=\"https://developer.huawei.com/consumer/en/activity/digixActivity/digixdetail/201621219634131423\" target=\"_blank\" rel=\"noopener noreferrer\">2021 Huawei DIGIX Global AI Challenge</a>! Go TEAM IELAB!"
