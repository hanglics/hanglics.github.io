- date: "2021-08-25"
  body: "📃 Our journal paper <a href=\"https://arxiv.org/abs/2108.11044\" target=\"_blank\" rel=\"noopener noreferrer\">Pseudo Relevance Feedback with Deep Language Models and Dense Retrievers: Successes and Pitfalls</a> is now available on arXiv! Code is available at <a href=\"https://github.com/hanglics/Neural-Relevance-Feedback-Public\">here</a>. Paper is currently under review, was submitted to the <a href=\"https://dl.acm.org/journal/tois\">Journal of ACM Transactions on Information Systems (TOIS)</a> in June, 2021."
- date: "2020-12-15"
  body: "📃 Our paper <a href=\"BASE_PATH/files/ecir2021.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Deep Query Likelihood Model for Information Retrieval</a> has been accepted to <a href=\"https://www.ecir2021.eu\" target=\"_blank\" rel=\"noopener noreferrer\">ECIR 2021</a> as a short paper! The code is open-sourced <a href=\"https://github.com/ielab/GPT_Ranker\" target=\"_blank\" rel=\"noopener noreferrer\">here</a>. A video of the work is available <a href=\"https://www.youtube.com/watch?v=oSGbYaC0ur0\" target=\"_blank\" rel=\"noopener noreferrer\">here</a>."
- date: "2020-12-06"
  body: "📃 Our paper <a href=\"BASE_PATH/files/mob2021.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Design and Research of Intelligent Question-Answering(Q&A) System Based on High School Course Knowledge Graph</a> has been accepted to <a href=\"https://www.springer.com/journal/11036\" target=\"_blank\" rel=\"noopener noreferrer\">Mobile Networks and Applications</a> as a journal paper!"
