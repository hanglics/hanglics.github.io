  body: "📃 Our paper <a href=\"BASE_PATH/files/sigir2020_tools.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Systematic Review Automation Tools for End-to-End Query Formulation</a> has been accepted to <a href=\"https://sigir.org/sigir2020/\" target=\"_blank\" rel=\"noopener noreferrer\">SIGIR 2020</a> as a Demo paper! The code is open-sourced <a href=\"https://github.com/ielab/searchrefiner\" target=\"_blank\" rel=\"noopener noreferrer\">here</a>. A video of my talk is also available <a href=\"https://dl.acm.org/doi/10.1145/3397271.3401402\" target=\"_blank\" rel=\"noopener noreferrer\">online</a>."
- date: "2020-03-01"
  body: "🏫 I am thrilled to announce that I will be joining <a href=\"http://ielab.io/\" target=\"_blank\" rel=\"noopener noreferrer\">IELab</a> @ <a href=\"https://www.uq.edu.au/\" target=\"_blank\" rel=\"noopener noreferrer\">UQ</a> as a Ph.D student in Information Retrieval under the supervision of <a href=\"http://ielab.io/people/guido-zuccon\" target=\"_blank\" rel=\"noopener noreferrer\">A/Prof. Guido Zuccon</a> starting next month!"
