  body: "💬 I will present our work on <a href=\"BASE_PATH/files/sigir2020_tools.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Systematic Review Automation Tools for End-to-End Query Formulation</a> at the <a href=\"https://sigir.org/sigir2020/\" target=\"_blank\" rel=\"noopener noreferrer\">SIGIR 2020</a>!"
