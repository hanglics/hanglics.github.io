  image: /images/publications/cast2020.webp
  kind: generated
  source: /files/cross2020treccast.pdf
  alt: 'Two conversational search systems: context-expanded BM25/RM3 retrieval, and manually rewritten-query
    BM25/RM3 retrieval with T5 query-likelihood reranking.'
  width: 1200
  height: 800
  selection_note: The paper contains conversation examples and evaluation tables but no system or pipeline
    figure.
  generator: built-in image_gen
  prompt: 'Use case: scientific-educational. Landscape 3:2 academic publication thumbnail. Restrained
    clean technical editorial illustration, crisp readable flat modules with gentle depth, white/off-white
    background, blue and teal with restrained amber accents, generous safe margins. No numbers, results
    graphs, logos, watermark, title or dense prose. This is a conceptual research illustration. Represent
    TWO INDEPENDENT systems explored in the IELAB TREC CAsT 2020 report. Draw two clearly separated horizontal
    rows with no arrows between them.

    Top row: conversational context (first utterance) and current question combine at a context expansion
    module, then BM25 + RM3 retrieval, then ranked passages. This row ends at ranked passages; it DOES
    NOT connect to T5.

    Bottom row: manually rewritten query flows through BM25 + RM3 retrieval, then a T5-QLM reranker, then
    a separate ranked passage stack. This row does not receive the top row''s automatic expansion.

    Labels only: "Context expansion", "BM25 + RM3", "Ranked passages", "Rewritten query", "T5-QLM". Show
    chat bubbles for the first row and a rewritten query card for the second. Maintain distinct separate
    row backgrounds or lane spacing.'
