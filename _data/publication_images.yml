  width: 1200
  height: 800
  selection_note: All pages and both figure captions inspected. The only figures report model-size, effectiveness,
    and latency results; no overall pipeline diagram.
  generator: built-in image_gen
  prompt: 'Use case: scientific-educational. Asset type: landscape academic publication thumbnail in a
    3:2 composition. Create a restrained editorial scientific illustration that reads clearly at a small
    size: crisp flat diagram shapes with gentle depth, generous white space, white/off-white background,
    coordinated blue and teal with restrained amber accents. Preserve safe margins. Only sparse short
    labels and clear arrows. No paper title, logos, watermarks, dense prose, invented numerical findings
    or performance charts. This is a conceptual method illustration, not an experimental figure. TPRF
    is a small transformer-based pseudo-relevance feedback model for dense retrieval. Stack an original
    query vector with top-k feedback passage vectors; send these through a compact attention/transformer
    block labelled TPRF; emit a refined query vector which searches the same dense vector index to produce
    ranked results. Visually emphasize embedding vectors and a compact module, not text generation or
    language-model answers. Exact labels only: "Query", "Feedback vectors", "TPRF", "Refined query", "Vector
    index", "Results".'
