arxiv2026-2:
  image: /images/publications/arxiv2026-2.webp
  kind: generated
  source: https://arxiv.org/pdf/2609.38099
  alt: Shared in-context examples condition independent query and document LLM encoding; embeddings are
    compared to retrieve ranked documents.
  width: 1200
  height: 800
  selection_note: Paper figures are a recall plot and long prompt templates, with no overall pipeline
    figure.
  generator: built-in image_gen
  prompt: 'Use case: scientific-educational.

    Asset type: landscape publication thumbnail for an academic researcher website, 3:2 composition.

    Create a polished restrained scientific illustration of RICE (Representations from In-Context Examples),
    a training-free dense retrieval method. Based on this actual paper: a few shared query-document demonstrations
    condition both query and document encoding; a decoder-only language model generates a representative
    word, whose final hidden state becomes an embedding; query and document embeddings are compared for
    retrieval. Show two parallel lanes: Query and Documents, receiving the same small stack of shared
    examples; each passes through a matching language-model encoder module into compact embedding bars;
    the lanes converge at a similarity match and ranked documents. Do not show parameter training or fine-tuning.

    Style: refined clean editorial technical illustration with crisp flat diagram elements, subtle depth,
    generous white space, off-white background, blue and teal with a small amber accent. Visually readable
    as a small thumbnail. Preserve diagram margins. Exact short labels only: "Shared examples", "Query",
    "Documents", "LLM", "Embeddings", "Retrieval". No title, no metrics, no benchmark charts, no logos,
    no watermark, no dense prose. This is a conceptual illustration rather than an original experimental
    figure.'
  revision_prompt: 'Edit this RICE conceptual publication illustration, preserving the existing white
    background, visual style, labels, document icons, two LLM boxes, embedding strips, and retrieval ranking.

    Correct only the input arrows so the two encoder lanes are independent and both receive the shared
    examples: the Shared examples panel must have exactly two separate arrow paths, one ending at the
    blue query LLM box and one ending at the teal document LLM box. Remove the arrow from the shared examples
    panel to the upper Embeddings strip. Remove the vertical arrow from the blue LLM box to the teal LLM
    box. The Query card still feeds the blue LLM and the Documents stack still feeds the teal LLM; their
    embeddings still meet at similarity comparison and Retrieval. There must be no arrow from one LLM
    box to the other. Keep every label and all other elements unchanged.'
