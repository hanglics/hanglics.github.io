---
layout: compress
---

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js" data-theme="light" data-theme-mode="system">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="layout-{{ page.layout | default: 'single' }} {{ page.body_class }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include masthead.html %}
    {{ content }}
    <footer class="site-footer">
      {% include footer.html %}
      {% include footer/custom.html %}
    </footer>
    {% include scripts.html %}
  </body>
</html>
