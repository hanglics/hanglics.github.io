---
layout: default
---

<main id="main" class="site-container archive-main" tabindex="-1">
  {% unless page.hide_title %}
  <header class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    {% if page.title %}<h1 class="page__title">{{ page.title }}</h1>{% endif %}
    {% if page.intro %}<p class="page-lead">{{ page.intro }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="archive page__content">
    {{ content }}
  </div>
</main>
